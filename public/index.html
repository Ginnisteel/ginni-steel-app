<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ginni Steel — Order Desk</title>

<!-- Installable app setup -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16264B">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ginni Steel">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top" id="topBar" hidden>
  <div class="top-inner">
    <div class="brand"><img class="logo-img" src="/images/logo.png" alt="Ginni Steel">GINNI STEEL <span class="sub">Premium Stainless Steel Utensils · Pukhrayan, India</span></div>
    <div class="who" id="whoBar"></div>
  </div>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () { /* ignore */ });
    });
  }
</script>
</body>
</html>
